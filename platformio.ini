[platformio]
build_dir = C:/pio-build/ProjectAom

[env:esp32doit-devkit-v1]
; Arduino core 2.x retains hallRead() for the original ESP32 chip.
platform = espressif32 @ 7.0.0
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; First upload with USB. For later OTA uploads, uncomment and set the board's IP:
upload_protocol = espota
upload_port = 10.62.35.41
upload_flags = --auth=123456789
; Keep the OTA password in src/main.cpp synchronized with your upload tool.

lib_deps =
    knolleary/PubSubClient
